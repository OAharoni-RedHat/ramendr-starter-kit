# Partner CSI + S4: DRPolicy + hub DRClusters + validation without DRPC/VMs.
# Requires regionaldr-with-virt >= 0.1.0 (ramen.infrastructureEnabled + s3StoreProfiles upsert).
# Buckets are created by vp-s4-storage (s4Role.buckets); regionaldr upserts hub s3StoreProfiles
# only (ensureBuckets: false) and sets DRCluster.spec.s3ProfileName. opp-policy injects
# caCertificates only. (odf uses MirrorPeer for profiles; drpartner-minimal leaves
# infrastructureEnabled false.)
#
# PostSync argocd-sync-disable (wave 13) looks up the Application CR in
# pattern-clusterGroup.name (not destination $ARGOCD_APP_NAMESPACE) and adds hub
# ignoreDifferences for syncPolicy.automated so parent selfHeal cannot re-enable
# autosync after settlement.
#
# regionalDR list replace (Helm): keep cluster names; only 2m-novm DRPolicy (no 2m-vm).
ramen:
  resourcesEnabled: false
  infrastructureEnabled: true

drCluster:
  s3StoreProfiles:
    ensureBuckets: false

edgeGitopsVms:
  enabled: false

regionalDR:
  - name: resilient
    clusters:
      primary:
        name: ocp-primary
      secondary:
        name: ocp-secondary
    drpolicies:
      - interval: 2m
        name: 2m-drpolicy
