# Partner CSI minimal: Hive/BYOC + operators only — no S4, DRPolicy, DRClusters,
# or DRCluster validation. No DRPC/VMs either.
# Requires regionaldr-with-virt >= 0.1.0 (ramen.resourcesEnabled / infrastructureEnabled).
# Chart still runs PostSync argocd-sync-disable (wave 13) after settlement.
# That Job uses pattern-clusterGroup.name for the Application CR namespace (not
# destination $ARGOCD_APP_NAMESPACE) and adds hub ignoreDifferences for
# Application/regional-dr syncPolicy.automated so parent selfHeal cannot
# re-enable autosync.
#
# Preview RHDR catalog, IDMS, and hub subscription live in the hub/spoke BOMs
# (same as drpartner-s4), not in this regionaldr overlay.
ramen:
  resourcesEnabled: false
  infrastructureEnabled: false

edgeGitopsVms:
  enabled: false

# Run in BYOC mode by default. Most test scenarios require this for this
# variant.
byoc: true
