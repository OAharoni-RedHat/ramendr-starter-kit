---
global:
  pattern: ramendr-starter-kit
  vpNewFolderDir: true

  singleArgoCD: true
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic

  hub:
    provider: aws

main:
  # Selecting a variant loads variants/<name>/values-<name>.yaml when the
  # variants/ folder is present (global.vpNewFolderDir=true).
  # drpartner-minimal = partner CSI + preview RHDR (testing only).
  # drpartner-s4 = partner CSI + hub S4 + preview RHDR (testing only).
  # techdemo = full ODF Regional DR with Virtualization and Ansible Automation Platform (AAP) config-as-code. 
  #   Adds AAP instance and aap-config application driven by the ramendr-techdemo-config-as-code repo. 
  #   Deploys the Boutique workload on spoke clusters for end-to-end demo scenarios.
  #   odf remains the documented default in pattern-metadata.yaml.
  variant: techdemo
  multiSourceConfig:
    enabled: true
    # Need >= 0.9.57 for variants/ folder path helpers (vpNewFolderDir).
    clusterGroupChartVersion: 0.9.*
